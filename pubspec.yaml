name: zephlink
description: Your phone and your PC, one breeze apart.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  cross_file: ^0.3.4
  ffi: ^2.1.3
  file_selector: ^1.0.3
  file_selector_android: ^0.5.0
  desktop_drop: ^0.5.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  tray_manager: ^0.5.1
  window_manager: ^0.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_handler: ^0.0.25
  flutter_local_notifications: ^22.3.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/zephlink.ico
